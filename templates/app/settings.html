{% extends 'app/base.html' %}

{% block content %}
        <section class="col-lg-8">

            {% if form.non_field_errors %}
            <div class="text-danger my-2">
              {{ form.non_field_errors.0 }}
            </div>
          {% endif %}

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row mb-2">
                <label for="input_4" class="col-3 col-form-label">Login</label>
                <div class="col-5">
                    <input type="text" class="form-control" id="input_4" value="{{ request.user.username }}" name="username">
                </div>
            </div>
            <div class="row mb-2">
                <label for="input_5" class="col-3 col-form-label">Email</label>
                <div class="col-5">
                    <input type="email" class="form-control" id="input_5" value="{{ request.user.email }}" name="email">
                </div>
            </div>
            <div class="row">
                <label for="input_4" class="col-3 col-form-label">Upload avatar</label>
                <div class="col-5 mb-3">
                        <input class="form-control" type="file" id="image" name="avatar" accept="image/*">
                </div>
            </div>
            <button class="btn btn-outline-primary col-lg-2 offset-3">Save</button>
        </form>
      </section>
{% endblock %}
