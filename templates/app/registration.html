{% extends 'app/base.html' %}

{% block content %}
      <section class="col-lg-7 offset-1">
        <div class="fw-semibold fs-4 mb-3">Registration</div>


          {% if form.non_field_errors %}
            <div class="text-danger my-2">
              {{ form.non_field_errors.0 }}
            </div>
          {% endif %}

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="row mb-2">
                <label for="input_4" class="col-3 col-form-label">Login</label>
                <div class="col-5">
                    <input type="text" class="form-control" id="input_4" name="username" value="{{ form.cleaned_data.username|default:'' }}">
                </div>

            </div>
            <div class="row mb-2">
                <label for="input_5" class="col-3 col-form-label">Email</label>
                <div class="col-5">
                    <input type="email" class="form-control" id="input_5" name="email" value="{{ form.cleaned_data.email|default:'' }}">
                </div>
            </div>
            <div class="row mb-2">
                <label for="input_7" class="col-3 col-form-label">Password</label>
                <div class="col-5">
                    <input type="password" class="form-control" id="input_7" name="password">
                </div>
            </div>
            <div class="row mb-2">
                <label for="input_8" class="col-3 col-form-label">Repeat password</label>
                <div class="col-5">
                    <input type="password" class="form-control" id="input_8" name="password_repeat">
                </div>
            </div>
            <div class="row mb-2">
                <label for="input_9" class="col-3 col-form-label">Upload avatar</label>
                <div class="col-5">
                    <input type="file" class="form-control" id="input_9" name="avatar">
                </div>
            </div>
            <button type="submit" class="btn btn-outline-primary col-lg-2 offset-3">Register</button>
        </form>
      </section>

{% endblock %}
