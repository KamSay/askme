<article class="card mb-3 border-0">
  <div class="card-body">
    <div class="d-grid gap-3" style="grid-template-columns:70px 1fr;">
      <div class="d-flex flex-column align-items-center justify-content-between pt-2">
        <div class="mb-2 d-flex flex-column align-items-center" >
          <img src="{{ question.author.profile.avatar.url }}" class="rounded-circle" width="32" height="32">
          <div class="text-secondary">{{ question.author.user.username }}</div>
        </div>

        <div class="d-flex align-items-center gap-2">
          <button class="btn p-0">
            <i class="bi bi-caret-up"></i>
          </button>

          <span class="fs-6">{{ question.like_amount }}</span>

          <button class="btn p-0">
            <i class="bi bi-caret-down"></i>
          </button>
        </div>


      </div>
      <div class="d-flex flex-column align-items-center text-center">
        <div class="position-relative mx-5">
          <a class="stretched-link fs-4 u-break" href="{% url 'app:question' question.pk %}">{{ question.title }}</a>
          <p class="text-secondary mb-3 u-break">{{ question.text }}</p>
        </div>
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
          <div class="d-flex flex-wrap gap-2">
              {% for tag in question.tags.all %}
                {% include 'components/tag_badge.html' with tag=tag.name %}
              {% endfor %}
          </div>
        </div>
      </div>
    </div>
  </div>
</article>
